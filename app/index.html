          <div class="player-name">${p?.name || entry.name}</div>
          <div class="player-meta" style="color:var(--text3);margin-top:4px">No playoff data${ic?'':' for '+sv}</div>
        </div>
      </div>
    </div>`;
    const gp = pst.basic.GP || 0;
    const ws = pst.advanced?.WS;
    const max0 = (k) => Math.max(getV(0,k), getV(1,k)) || 1;
    return `<div class="player-card">
      <div class="player-head">
        <div class="avatar av${i+1}">${ini(p?.name || entry.name || '?')}</div>
        <div>
          <div class="player-name">${p?.name || entry.name}<span class="po-badge">PLAYOFFS</span></div>
          <div class="player-meta">${ic?'Career':sv} · ${gp} GP${ws == null ? '' : ` · ${ws.toFixed(1)} WS`}</div>
        </div>
      </div>
      <div class="stat-grid">${['PPG','RPG','APG'].map(k => {
        const v = getV(i, k);
        return `<div class="stat-block">
          <div class="stat-label">${k}</div>
          <div class="stat-val">${v.toFixed(1)}</div>
          <div class="stat-bar-wrap"><div class="stat-bar bar${i+1}" style="width:${Math.min(v/max0(k)*100,100).toFixed(0)}%"></div></div>
        </div>`;
      }).join('')}</div>
    </div>`;
  }).join('');

  const poRows = Object.entries(PO_DEFS).map(([k, lbl]) => {
    const v1 = getV(0, k), v2 = getV(1, k), lb = loBetter.has(k), t = v1 + v2 || 1;
    const w = lb ? (v1<v2?1:v1>v2?2:0) : (v1>v2?1:v1<v2?2:0);
    return `<div class="h2h-row">
      <div class="hval ${w===1?'w1':''}">${v1.toFixed(1)}</div>
      <div><div class="hlbl">${lbl}</div>
        <div class="bar-track">
          <div class="bl" style="width:${((v1/t)*100).toFixed(1)}%"></div>
          <div class="br" style="width:${((v2/t)*100).toFixed(1)}%"></div>
        </div></div>
      <div class="hval ${w===2?'w2':''}">${v2.toFixed(1)}</div>
    </div>`;
  }).join('');

  area.innerHTML = `
    <div class="share-row"><button id="share-btn" class="share-btn" onclick="shareComparison()">⎘ Share</button></div>
    <div class="cards-grid">${cards}</div>
    <div class="h2h-card"><div class="h2h-title">PLAYOFFS HEAD TO HEAD</div>${poRows}</div>`;
}


// ── RENDER DISPATCH ───────────────────────────────────────────────────────────
function render() {
  const area = document.getElementById('area');
  area.classList.remove('area-fade');
  void area.offsetWidth;
  area.classList.add('area-fade');

  // Leaders tab works without players selected

  if (!sel[0] && !sel[1]) {
    area.innerHTML='<div class="placeholder" aria-live="polite"><div class="placeholder-icon">🏀</div>Search two players above to start comparing</div>';
    return;
  }
  if (!sel[0]||!sel[1]) {
    area.innerHTML='<div class="placeholder" aria-live="polite"><div class="placeholder-icon">🔍</div>Now pick a second player to compare</div>';
    return;
  }
  if (!selData[0]||!selData[1]) return;
  if (activeTab==='shotchart') { renderShotChart(area); return; }
  if (activeTab==='arc')       { renderArc(area);       return; }
  if (activeTab==='radar')     { renderRadar(area);     return; }
  if (activeTab==='playoffs')  { renderPlayoffs(area);  return; }
  renderStats(area);
}

function buildFeaturedLinks() {
  const grid = document.getElementById('featured-grid');
  if (!grid) return;
  grid.innerHTML = FEATURED.map(([a, b]) => {
    const sa = slugify(a), sb = slugify(b);
    return `<a class="featured-link" href="?p1=${sa}&p2=${sb}" onclick="handleFeatured(event,'${sa}','${sb}')" aria-label="Compare ${a} vs ${b}">
      <span>${a}</span>
      <span class="featured-link-vs">vs</span>
      <span>${b}</span>
    </a>`;
  }).join('');
}

async function handleFeatured(e, slug1, slug2) {
  e.preventDefault();
  viewMode = 'compare';
  sel = [null, null]; selData = [null, null];
  history.pushState(null, '', `?p1=${slug1}&p2=${slug2}`);

  const app = document.getElementById('app');
  renderCompareView(app);

  const load = async (i, slug) => {
    const entry = INDEX.find(p => p.slug === slug);
    if (!entry) return;
    const inp = document.getElementById('s' + (i + 1));
    if (inp) inp.value = entry.name;
    const data = await loadPlayer(slug);
    applyPlayerSelection(i, entry, data, 'Career');
  };
  await Promise.all([load(0, slug1), load(1, slug2)]);
  updateMeta();
  render();
}

// ── APP ROUTER ─────────────────────────────────────────────────────────────────
function renderApp() {
  const app = document.getElementById('app');
  if (!app) return;
  const params = new URLSearchParams(window.location.search);
  const playerSlug = params.get('player');
  const p1 = params.get('p1');
  const p2 = params.get('p2');

  if (playerSlug) {
    viewMode = 'player'; soloSlug = playerSlug;
    soloSeason = params.get('season') || 'Career';
    renderSinglePlayer(app);
  } else if (p1 || p2) {
    viewMode = 'compare';
    renderCompareView(app);
  } else {
    viewMode = 'landing';
    renderLanding(app);
  }
}

function goToLanding() {
  viewMode = 'landing'; soloSlug = null; soloSeason = 'Career';
  history.pushState(null, '', window.location.pathname);
  renderApp();
}

async function goToPlayer(slug, season) {
  soloSlug = slug; soloSeason = season || 'Career';
  const params = new URLSearchParams();
  params.set('player', slug);
  if (soloSeason !== 'Career') params.set('season', soloSeason);
  history.pushState(null, '', '?' + params.toString());
  renderApp();
}

function setSoloSeason(season) {
  soloSeason = season;
  const params = new URLSearchParams();
  params.set('player', soloSlug);
  if (season !== 'Career') params.set('season', season);
  history.replaceState(null, '', '?' + params.toString());
  renderApp();
}

async function goToCompareMode(preloadSlug) {
  viewMode = 'compare'; sel = [null, null]; selData = [null, null];
  const params = new URLSearchParams();
  if (preloadSlug) params.set('p1', preloadSlug);
  history.pushState(null, '', params.toString() ? '?' + params.toString() : window.location.pathname);

  const app = document.getElementById('app');
  renderCompareView(app);

  if (preloadSlug) {
    const entry = INDEX.find(p => p.slug === preloadSlug);
    if (entry) {
      try {
        const data = PLAYERS[preloadSlug] || await loadPlayer(preloadSlug);
        applyPlayerSelection(0, entry, data, 'Career');
        render();
      } catch(e) {}
    }
  }
  setTimeout(() => document.getElementById(preloadSlug ? 's2' : 's1')?.focus(), 80);
}

function buildSoloPlayoffSection(p, season) {
  const poData = p.playoffs?.[season] || p.playoffs?.['Career'];
  if (!poData?.basic) return '';
  const regBas = (p.seasons?.[season] || p.seasons?.['Career'])?.basic || {};
  const poBas  = poData.basic;
  const rows = [['PPG','PPG'],['RPG','RPG'],['APG','APG'],['SPG','SPG'],['BPG','BPG']]
    .filter(([k]) => regBas[k] != null || poBas[k] != null)
    .map(([k, lbl]) => {
      const rv = (regBas[k] ?? 0).toFixed(1);
      const pv = (poBas[k] ?? 0).toFixed(1);
      const rn = regBas[k] || 0, pn = poBas[k] || 0, mx = Math.max(rn, pn, 0.01);
      const up = pn > rn;
      return `<div class="h2h-row">
        <div class="hval">${rv}</div>
        <div>
          <div class="hlbl">${lbl}</div>
          <div class="bar-track" style="height:3px">
            <div class="bl" style="width:${(rn/mx*50).toFixed(0)}%"></div>
            <div class="br" style="width:${(pn/mx*50).toFixed(0)}%"></div>
          </div>
        </div>
        <div class="hval${up?' w2':''}">${pv}</div>
      </div>`;
    }).join('');
  if (!rows) return '';
  return `<div class="h2h-card" style="margin-bottom:12px">
    <div class="h2h-title">Regular Season vs Playoffs</div>
    <div class="h2h-row" style="margin-bottom:4px">
      <div class="hval" style="font-size:11px;color:var(--text3)">Regular</div>
      <div></div>
      <div class="hval" style="font-size:11px;color:var(--text3)">Playoffs</div>
    </div>
    ${rows}
  </div>`;
}

// ── SOLO CHARTS ────────────────────────────────────────────────────────────────
let _soloHoveredZone = null;
let _soloZoneCache = null;

function startSoloZoneLoop() {
  stopSoloZoneLoop();
  if (soloShotMode !== 'zones') return;
  const canvas = document.getElementById('solo-hmap');
  if (!canvas) return;
  canvas.addEventListener('mousemove', _soloZoneMouseMove);
  canvas.addEventListener('mouseleave', _soloZoneMouseLeave);
}

function stopSoloZoneLoop() {
  const canvas = document.getElementById('solo-hmap');
  if (canvas) {
    canvas.removeEventListener('mousemove', _soloZoneMouseMove);
    canvas.removeEventListener('mouseleave', _soloZoneMouseLeave);
  }
  _soloHoveredZone = null;
}

function _soloZoneMouseMove(e) {
  const canvas = e.currentTarget;
  const [nbaX, nbaY] = canvasToNBA(canvas, e);
  const zone = classifyZone(nbaX, nbaY);
  if (zone !== _soloHoveredZone) {
    _soloHoveredZone = zone;
    // Static highlight — draw once at full brightness, no flicker
    drawZoneChart(canvas, _soloZoneCache, zone, zone ? 1 : 0);
  }
}

function _soloZoneMouseLeave(e) {
  _soloHoveredZone = null;
  drawZoneChart(e.currentTarget, _soloZoneCache, null, 0);
}

function setSoloShotMode(mode) {
  soloShotMode = mode;
  document.querySelectorAll('[data-solo-mode]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.soloMode === mode);
  });
  stopSoloZoneLoop();
  paintSoloHeatmap();
  if (mode === 'zones') startSoloZoneLoop();
}

function getSoloShotSeasons() {
  const p = PLAYERS[soloSlug];
  if (!p?.shots_by_season) return null;
  if (soloSeason !== 'Career') return p.shots_by_season[soloSeason]?.length ? {[soloSeason]: p.shots_by_season[soloSeason]} : null;
  return p.shots_by_season;
}

function getSoloShots() {
  const p = PLAYERS[soloSlug];
  if (!p?.shots_by_season) return null;
  if (soloSeason !== 'Career') return p.shots_by_season[soloSeason] || null;
  return Object.values(p.shots_by_season).flat().filter(Boolean);
}

function paintSoloHeatmap() {
  const canvas = document.getElementById('solo-hmap');
  if (!canvas) return;
  const W = canvas.parentElement?.offsetWidth || 320;
  const H = Math.round(W * 1.05);
  sizeCanvas(canvas, W, H);
  const shots = getSoloShots();
  if (soloShotMode === 'zones') {
    _soloZoneCache = shots?.length ? computeZonesFromShots(getSoloShotSeasons()) : null;
    drawZoneChart(canvas, _soloZoneCache, null);
  } else {
    const ctx = canvas.getContext('2d');
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg2').trim() || '#141416';
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    if (shots?.length) {
      if (soloShotMode === 'heat') drawThermalHeatmap(canvas, shots);
      else drawAccuracyDots(canvas, shots);
    }
    drawCourtLines(canvas);
  }
}

function paintSoloRadar() {
  const canvas = document.getElementById('solo-radar');
  if (!canvas || !window.Chart) return;
  const p = PLAYERS[soloSlug]; if (!p) return;
  const stats  = p.seasons?.[soloSeason] || p.seasons?.['Career'];
  const awards = (p.awards_by_season || {})[soloSeason] || [];
  const scores = computeRadar(stats, awards, soloSeason);
  if (soloRadarChart) { soloRadarChart.destroy(); soloRadarChart = null; }
  const gc = 'rgba(255,255,255,0.08)', tc = '#9e9b94';
  soloRadarChart = new Chart(canvas, {
    type: 'radar',
    data: { labels: radarLabels, datasets: [{
      data: radarAxes.map(k => scores[k]),
      borderColor: '#378ADD', backgroundColor: 'rgba(55,138,221,0.18)',
      pointBackgroundColor: '#378ADD', pointRadius: 4, borderWidth: 2,
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: 4 },
      plugins: { legend: { display: false } },
      scales: { r: {
        min: 0, max: 100,
        ticks: { display: false, stepSize: 25 },
        grid: { color: gc },
        pointLabels: { color: tc, font: { size: 13, family: 'DM Mono, monospace' } },
        angleLines: { color: 'rgba(255,255,255,0.06)' },
      }},
    },
  });
}

function setSoloArcMetric(metric) {
  soloArcMetric = metric;
  document.querySelectorAll('[data-arc-solo]').forEach(b => {
    b.classList.toggle('active', b.dataset.arcSolo === metric);
  });
  paintSoloArc();
}

function paintSoloArc() {
  const canvas = document.getElementById('solo-arc');
  if (!canvas) { if (soloArcChart) { soloArcChart.destroy(); soloArcChart = null; } return; }
  if (!window.Chart) return;
  const p = PLAYERS[soloSlug]; if (!p) return;
  const arcKey  = soloArcMetric === 'ppg' ? 'arc' : 'arc_' + soloArcMetric;
  const arcData = p[arcKey] || {};
  const labels  = Object.keys(arcData).sort();
  const values  = labels.map(k => arcData[k] ?? null);
  if (soloArcChart) { soloArcChart.destroy(); soloArcChart = null; }
  const tc = 'rgba(90,88,85,1)', gc = 'rgba(255,255,255,0.05)';
  soloArcChart = new Chart(canvas, {
    type: 'line',
    data: { labels, datasets: [{
      data: values,
      borderColor: '#378ADD', backgroundColor: 'rgba(55,138,221,0.10)',
      tension: 0.4, pointRadius: 4, pointHoverRadius: 6, spanGaps: false,
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
      scales: {
        x: { grid: { color: gc }, ticks: { color: tc, font: { size: 11 }, maxRotation: 45, autoSkip: true, maxTicksLimit: 12 } },
        y: { grid: { color: gc }, ticks: { color: tc, font: { size: 11 } },
             title: { display: true, text: ARC_METRICS[soloArcMetric]?.label || soloArcMetric.toUpperCase(), color: tc, font: { size: 11 } },
             beginAtZero: false },
      },
    },
  });
}
</script>
</body>
</html>
