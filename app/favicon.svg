<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="cl"><rect x="0" y="0" width="16" height="32"/></clipPath>
    <clipPath id="cr"><rect x="16" y="0" width="16" height="32"/></clipPath>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0d0d0f"/>
  <!-- Left half — blue -->
  <circle cx="16" cy="16" r="10.5" fill="#378ADD" clip-path="url(#cl)"/>
  <!-- Right half — orange -->
  <circle cx="16" cy="16" r="10.5" fill="#D85A30" clip-path="url(#cr)"/>
  <!-- Seam curves (dark on each half) -->
  <path d="M7.5 16 Q16 9.5 24.5 16" fill="none" stroke="rgba(0,0,0,0.28)" stroke-width="1.2"/>
  <path d="M7.5 16 Q16 22.5 24.5 16" fill="none" stroke="rgba(0,0,0,0.28)" stroke-width="1.2"/>
  <!-- Center dividing line -->
  <line x1="16" y1="5.5" x2="16" y2="26.5" stroke="#0d0d0f" stroke-width="2"/>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="#0d0d0f" stroke-width="1.5"/>
</svg>
